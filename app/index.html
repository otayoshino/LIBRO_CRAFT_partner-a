      </button>
      <!-- LIBRO形式書き出し（LIBRO book未読込時は非活性。活性制御は updateLibroBookBtnStates） -->
      <button class="nav-btn disabled" id="libroExportBtn" data-tip="LIBRO形式で書き出す" onclick="saveAnnotationsAsLibroBook()">
        <svg width="16" height="16"><use href="icons/sprite.svg#icon-save"></use></svg>
      </button>
      <!-- 読込用ファイル選択input（非表示） -->
      <input type="file" id="zipFileInput" accept=".zip" style="display:none" onchange="handleZipFile(event)">
      <button class="nav-btn" data-tip="ZIP読込" onclick="loadAnnotationsFromZip()">
        <svg width="16" height="16"><use href="icons/sprite.svg#icon-load-zip"></use></svg>
      </button>
      <button class="nav-btn" data-tip="折りたたむ" onclick="toggleNav()">
        <svg width="16" height="16"><use href="icons/sprite.svg#icon-chevron-up"></use></svg>
      </button>
    </div>

  </nav>

  <!-- ナビ折りたたみ時のヘッダー展開ボタン -->
  <button id="navRevealBtn" title="ヘッダーを表示" onclick="toggleNav()">
    <svg width="14" height="14"><use href="icons/sprite.svg#icon-chevron-down"></use></svg>
  </button>

  <!-- ===========================
       メインエリア
  =========================== -->
  <div class="main">

    <!-- =======================
         サイドバー（オーサリング）
    ======================= -->
    <aside class="side authoring">
      <div class="inner">

        <!-- モード切替 -->
        <button class="mode-btn toDisplay" id="modeSwitchBtn" onclick="switchToViewMode()">
          <svg width="15" height="15"><use href="icons/sprite.svg#icon-mode-switch"></use></svg>
          <span id="modeSwitchBtnLabel">閲覧モードに切替</span>
        </button>

        <div id="authoringPanels">
        <button class="panel-title is-accordion no-border" onclick="toggleAcc('accAuthoring',this)">
          <svg width="11" height="11"><use href="icons/sprite.svg#icon-plus-square"></use></svg>
          オーサリングパネル
          <svg class="acc-chevron" width="12" height="12"><use href="icons/sprite.svg#icon-chevron-down"></use></svg>
        </button>
        <div class="acc-body" id="accAuthoring">
        <div class="panel">
          <ul class="panel-stack">
            <!-- 付箋 -->
            <li onclick="activateAnnotationMode('sticky')" data-tip="付箋を追加" data-ann-type="sticky">
              <div>
                <svg width="18" height="18"><use href="icons/sprite.svg#icon-sticky"></use></svg>
              </div>
              <p>付箋</p>
            </li>
            <!-- 音声再生 -->
            <li onclick="activateAnnotationMode('audio')" data-tip="音声再生ボタンを追加" data-ann-type="audio">
              <div>
                <svg width="21" height="18"><use href="icons/sprite.svg#icon-audio"></use></svg>
              </div>
              <p>音声再生</p>
            </li>
            <!-- 動画再生 -->
            <li onclick="activateAnnotationMode('video')" data-tip="動画再生ボタンを追加" data-ann-type="video">
              <div>
                <svg width="21" height="18"><use href="icons/sprite.svg#icon-video"></use></svg>
              </div>
              <p>動画再生</p>
            </li>
            <!-- Plusファイル -->
            <li onclick="activateAnnotationMode('plusfile')" data-tip="Plusファイルを追加" data-ann-type="plusfile">
              <div>
                <svg width="15" height="18"><use href="icons/sprite.svg#icon-file"></use></svg>
              </div>
              <p>Plusファイル</p>
            </li>
            <!-- ページリンク -->
            <li onclick="activateAnnotationMode('pagelink')" data-tip="ページリンクを追加" data-ann-type="pagelink">
              <div>
                <svg width="20" height="18"><use href="icons/sprite.svg#icon-pagelink"></use></svg>
              </div>
              <p>ページリンク</p>
            </li>
            <!-- 外部リンク -->
            <li onclick="activateAnnotationMode('externallink')" data-tip="外部リンクを追加" data-ann-type="externallink">
              <div>
                <svg width="20" height="18"><use href="icons/sprite.svg#icon-externallink"></use></svg>
              </div>
              <p>外部リンク</p>
            </li>
          </ul>
        </div><!-- /.panel -->
        </div><!-- /#accAuthoring -->

        <hr class="panel-sep">

        <!-- 付箋パーツ操作 -->
        <button class="panel-title is-accordion" onclick="toggleAcc('accStickyOps',this)">
          <svg width="11" height="11"><use href="icons/sprite.svg#icon-plus-square"></use></svg>
          付箋パーツ操作
          <svg class="acc-chevron" width="12" height="12"><use href="icons/sprite.svg#icon-chevron-down"></use></svg>
        </button>
        <div class="acc-body" id="accStickyOps">
        <div class="panel">
          <ul class="panel-stack">
            <!-- 大問ボタン作成 -->
            <li class="is_disabled" onclick="createDaimonButton()" data-tip="選択中の付箋を一括表示/非表示する大問ボタンを作成">
              <div>
                <svg width="20" height="18"><use href="icons/sprite.svg#icon-daimon"></use></svg>
              </div>
              <p class="size_s">大問ボタン</p>
            </li>
            <!-- 付箋グループ切替 -->
            <li class="is_disabled" onclick="toggleStickyGroup()" data-tip="付箋のグループ化／解除を切替">
              <div>
                <svg width="20" height="20"><use href="icons/sprite.svg#icon-sticky-group"></use></svg>
              </div>
              <p class="size_s">付箋グループ切替</p>
            </li>
            <!-- 付箋を隠す -->
            <li class="is_disabled" onclick="onMisetteiBtnClick()" data-tip="非表示の付箋を表示・白色化">
              <div>
                <svg width="20" height="18"><use href="icons/sprite.svg#icon-hide"></use></svg>
              </div>
              <p class="size_s">付箋を隠す</p>
            </li>
            <!-- 答ボタン作成 -->
            <li class="is_disabled" onclick="createKotaeButton()" data-tip="答ボタンを作成">
              <div>
                <svg width="20" height="18"><use href="icons/sprite.svg#icon-kotae"></use></svg>
              </div>
              <p class="size_s">答</p>
            </li>
            <!-- 証明ボタン作成 -->
            <li class="is_disabled" onclick="createShomeiButton()" data-tip="証明ボタンを作成">
              <div>
                <svg width="20" height="18"><use href="icons/sprite.svg#icon-shomei"></use></svg>
              </div>
              <p class="size_s">証明</p>
            </li>
          </ul>
        </div><!-- /.panel -->
        </div><!-- /#accStickyOps -->

        <!-- 詳細設定パネル -->
        <hr class="panel-sep">
        <button class="panel-title is-accordion" onclick="toggleAcc('accDetail',this)">
          <svg width="11" height="11"><use href="icons/sprite.svg#icon-edit"></use></svg>
          詳細設定
          <svg class="acc-chevron" width="12" height="12"><use href="icons/sprite.svg#icon-chevron-down"></use></svg>
        </button>
        <div class="acc-body" id="accDetail">
        <div id="sideDetailPanel">
          <!-- デフォルト：グレーアウト展示の付箋フォーム -->
          <div id="sideDetailEmpty">
            <div class="side-detail-grayed">
              <p class="side-detail-title">付箋設定</p>
              <div class="side-detail-form">
                <dl>
                  <dt>位置</dt>
                  <dd>
                    <div class="pos-row">
                      <span>X</span><div class="pos-field"><div class="spin-btns"><button class="spin-btn spin-up" disabled>▲</button><button class="spin-btn spin-down" disabled>▼</button></div><input class="d-input d-input-sm" type="number" disabled value="0"></div>
                      <span>Y</span><div class="pos-field"><div class="spin-btns"><button class="spin-btn spin-up" disabled>▲</button><button class="spin-btn spin-down" disabled>▼</button></div><input class="d-input d-input-sm" type="number" disabled value="0"></div>
                    </div>
                  </dd>
                  <dt>変形</dt>
                  <dd>
                    <div class="pos-row">
                      <span>W</span><div class="pos-field"><div class="spin-btns"><button class="spin-btn spin-up" disabled>▲</button><button class="spin-btn spin-down" disabled>▼</button></div><input class="d-input d-input-sm" type="number" disabled value="0"></div>
                      <span>H</span><div class="pos-field"><div class="spin-btns"><button class="spin-btn spin-up" disabled>▲</button><button class="spin-btn spin-down" disabled>▼</button></div><input class="d-input d-input-sm" type="number" disabled value="0"></div>
                    </div>
                  </dd>
                  <dt>塗り</dt>
                  <dd class="color-row">
                    <div class="d-select-wrap">
                      <select class="d-select" disabled><option>黄（標準）</option></select>
                    </div>
                  </dd>
                </dl>
              </div>
            </div>
          </div>
          <!-- アクティブ時 -->
          <div id="sideDetailActive" style="display:none">
            <p class="side-detail-title" id="dialogTitle"></p>
            <!-- 共通セクション：位置・W・H・塗色（常時表示） -->
            <div class="side-detail-form" id="sideDetailCommonWrap">
              <dl id="dialogFormCommon"></dl>
            </div>
            <!-- セパレータ -->
            <div class="detail-section-sep" id="detailSectionSep" style="display:none">
              <span>種別設定</span>
            </div>
            <!-- 種別固有セクション（オブジェクト選択時のみ表示） -->
            <div class="side-detail-form" id="sideDetailSpecificWrap" style="display:none">
              <dl id="dialogFormSpecific"></dl>
            </div>
            <div class="side-detail-footer">
              <!-- JS参照用に非表示で残す（削除するとquerySelectorがnullエラーになる） -->
              <button class="dialog-btn delete-btn" style="display:none"></button>
              <button class="dialog-btn cancel" style="display:none"></button>
              <button class="dialog-btn ok"     style="display:none"></button>
            </div>
          </div>
        </div><!-- /#sideDetailPanel -->
        </div><!-- /#accDetail -->

        <!-- 整列パネル -->
        <hr class="panel-sep">
        <button class="panel-title is-accordion" onclick="toggleAcc('accAlign',this)">
          <svg width="11" height="11"><use href="icons/sprite.svg#icon-align-header"></use></svg>
          整列
          <svg class="acc-chevron" width="12" height="12"><use href="icons/sprite.svg#icon-chevron-down"></use></svg>
        </button>
        <div class="acc-body" id="accAlign">
        <div id="alignPanel" class="align-panel is-disabled">
          <div class="align-row">
            <span class="align-row-label">水平</span>
            <div class="align-btns">
              <button class="align-btn" onclick="alignObjects('left')" title="水平左揃え">
                <svg width="22" height="19"><use href="icons/sprite.svg#icon-align-left"></use></svg>
              </button>
              <button class="align-btn" onclick="alignObjects('centerH')" title="水平中央揃え">
                <svg width="22" height="19"><use href="icons/sprite.svg#icon-align-centerH"></use></svg>
              </button>
              <button class="align-btn" onclick="alignObjects('right')" title="水平右揃え">
                <svg width="22" height="19"><use href="icons/sprite.svg#icon-align-right"></use></svg>
              </button>
            </div>
          </div>
          <div class="align-row">
            <span class="align-row-label">垂直</span>
            <div class="align-btns">
              <button class="align-btn" onclick="alignObjects('top')" title="垂直上揃え">
                <svg width="22" height="19"><use href="icons/sprite.svg#icon-align-top"></use></svg>
              </button>
              <button class="align-btn" onclick="alignObjects('centerV')" title="垂直中央揃え">
                <svg width="22" height="19"><use href="icons/sprite.svg#icon-align-centerV"></use></svg>
              </button>
              <button class="align-btn" onclick="alignObjects('bottom')" title="垂直下揃え">
                <svg width="22" height="19"><use href="icons/sprite.svg#icon-align-bottom"></use></svg>
              </button>
            </div>
          </div>
        </div><!-- /#alignPanel -->
        </div><!-- /#accAlign -->

        </div><!-- /#authoringPanels -->

      </div><!-- /.inner -->
    </aside>

    <!-- =======================
         ビューエリア（ページ表示）
    ======================= -->
    <div class="view" id="viewArea">

      <!-- スライドナビゲーションボタン（前後ページ送り） -->
      <button class="slide-nav slide-nav--prev is-hidden" id="slideNavPrev" onclick="prevPage()" title="前のページ">
        <svg width="24" height="24"><use href="icons/sprite.svg#icon-prev-page"></use></svg>
      </button>
      <button class="slide-nav slide-nav--next is-hidden" id="slideNavNext" onclick="nextPage()" title="次のページ">
        <svg width="24" height="24"><use href="icons/sprite.svg#icon-next-page"></use></svg>
      </button>

      <!-- ページ表示コンテナ -->
      <div class="page-container" id="pageContainer">

        <!-- 単ページ表示 -->
        <div class="page no-book" id="pageLeft"
             onmousedown="onPageMouseDown(event)"
             onmousemove="onPageMouseMove(event)"
             onmouseup="onPageMouseUp(event)">
          <div id="pageDropOverlay">
            <button type="button" id="bookLoadBtn" onclick="loadAnnotationsFromZip()">LIBRO bookを読み込む（ZIP）</button>
          </div>
          <canvas id="pageCanvas" class="page-content"></canvas>
          <div id="spreadLockOverlay"><span>見開きページの編集はできません</span></div>
        </div>

        <!-- ZIP読込中ローディング（page-container中央に表示） -->
        <div class="loader-overlay" id="loaderOverlay">
          <div class="loader"></div>
        </div>

      </div><!-- /.page-container -->

    </div><!-- /.view -->

  </div><!-- /.main -->

  <!-- 画面中央トースト -->
  <div class="toast-overlay">
    <div class="toast-msg" id="toastMsg"></div>
  </div>

  <!-- インデックス編集モーダル -->
  <div id="indexEditorOverlay">
    <div class="index-editor">
      <p class="index-editor-title">インデックス編集</p>
      <div id="indexEditorRows"></div>
      <div class="index-editor-actions">
        <button type="button" onclick="addIndexRow()">＋ 項目を追加</button>
        <span class="spacer"></span>
        <button type="button" onclick="closeIndexEditor(false)">キャンセル</button>
        <button type="button" class="ok" onclick="closeIndexEditor(true)">OK</button>
      </div>
    </div>
  </div>

  <!-- ===========================
       JavaScript
  =========================== -->
  <script type="module" src="js/main.js"></script>

</body>
</html>
